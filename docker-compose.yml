# THdocs ติดตั้งเอง
#   docker compose up -d --build                       เว็บอย่างเดียว (ผู้ใช้ใส่ API key ของตนเองในหน้าตั้งค่า AI)
#   docker compose --profile local-ai up -d --build    เว็บ + Ollama ในเครื่อง (ข้อมูลไม่ออกนอกเครื่อง)
#   docker compose --profile public up -d --build      เปิดสาธารณะ: เว็บ + Caddy (HTTPS อัตโนมัติ) ตั้ง THDOCS_DOMAIN และ THDOCS_PUBLIC_URL ใน .env
#   docker compose exec ollama ollama pull qwen3.5:9b  ดึงโมเดล (ครั้งแรก ต้องมีที่ว่าง/หน่วยความจำพอ)
# แล้วเปิด http://localhost:3000
services:
  web:
    build: .
    image: thdocs
    ports:
      - "127.0.0.1:${THDOCS_PORT:-3000}:3000"   # เปิดให้เครื่องอื่นใช้: ใส่ reverse proxy + HTTPS หน้าเว็บนี้ ไม่เปิดพอร์ตตรง
    environment:
      # AI ที่เซิร์ฟเวอร์เรียกให้ (ไม่ตั้ง = ให้ผู้ใช้ใส่ key ในหน้าตั้งค่า AI)
      THDOCS_OLLAMA_URL: ${THDOCS_OLLAMA_URL:-}
      THDOCS_LMSTUDIO_URL: ${THDOCS_LMSTUDIO_URL:-}
      # 1 = ใช้ API key ของเซิร์ฟเวอร์แทนผู้ใช้ (เฉพาะใช้ภายในองค์กร) — ใส่ key ใน .env ไม่ใส่ในไฟล์นี้
      THDOCS_SERVER_KEYS: ${THDOCS_SERVER_KEYS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      THDOCS_PUBLIC_URL: ${THDOCS_PUBLIC_URL:-}   # โดเมนจริง (https://...) ใช้สร้าง manifest ของ Word add-in
      THDOCS_RATE_LIMIT: ${THDOCS_RATE_LIMIT:-}
      THDOCS_SOURCE_URL: ${THDOCS_SOURCE_URL:-}   # ลิงก์ซอร์สโค้ดของเวอร์ชันที่รัน (AGPL ข้อ 13) — ตั้งก่อนเปิดสาธารณะ
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  proxy:
    profiles: ["public"]
    image: caddy:2@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    ports:
      - "80:80"
      - "443:443"
    environment:
      THDOCS_DOMAIN: ${THDOCS_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:latest   # ปักเป็น digest/เวอร์ชันก่อนใช้งานจริง
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # ไม่เปิดพอร์ตออกนอก network ของ compose — เว็บเรียกผ่าน http://ollama:11434

volumes:
  ollama:
  caddy_data:
